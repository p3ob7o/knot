# The Xcode project, generated by XcodeGen (docs/architecture.md §1). The generated
# Knot.xcodeproj is not committed: run scripts/bootstrap.sh. Never edit the generated
# project.
#
# Each target lives in its own file, included below. WP-01 declares every target up front,
# so that later packages do not edit this file or the target files.

name: Knot

options:
  bundleIdPrefix: com.p3ob7o
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

# Every setting the targets share is in Apps/Config/Base.xcconfig.
configFiles:
  Debug: Apps/Config/Base.xcconfig
  Release: Apps/Config/Base.xcconfig

packages:
  KnotKit:
    path: Packages/KnotKit

targetTemplates:
  # Every app and extension: refuses a build whose flavour, signing and level do not agree.
  KnotProduct:
    preBuildScripts:
      - name: Check the build flavour
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          case "$KNOT_FLAVOUR" in
            dev) ;;
            milestone)
              if [ "$KNOT_SIGNING" != team ]; then
                echo "error: a milestone build signs with the owner's team (KNOT_SIGNING=team)."; exit 1
              fi
              case "$KNOT_MILESTONE_LEVEL" in
                M1|M2|M3|M4|M5|M6|M7) ;;
                *) echo "error: a milestone build names its level, KNOT_MILESTONE_LEVEL=M1 … M7."; exit 1 ;;
              esac
              case "$MARKETING_VERSION" in
                0.0.*|0.1.*|0.2.*) echo "error: a milestone build carries a version above 0.2.0."; exit 1 ;;
              esac
              ;;
            *) echo "error: KNOT_FLAVOUR is dev or milestone, not '$KNOT_FLAVOUR'."; exit 1 ;;
          esac

include:
  - path: Apps/iOS/targets.yml
  - path: Apps/watchOS/targets.yml
  - path: Apps/macOS/targets.yml
  - path: Apps/macOS/Tool/targets.yml
  - path: Apps/Extensions/Widgets-iOS/targets.yml
  - path: Apps/Extensions/Widgets-watchOS/targets.yml

schemes:
  Knot-iOS:
    build:
      targets:
        Knot-iOS: all
    test:
      targets:
        - Knot-iOS-Tests
        - Knot-iOS-UITests
  Knot-watchOS:
    build:
      targets:
        Knot-watchOS: all
    test:
      targets:
        - Knot-watchOS-UITests
  Knot-macOS:
    build:
      targets:
        Knot-macOS: all
    test:
      targets:
        - Knot-macOS-UITests
  knot-tool:
    build:
      targets:
        knot-tool: all
