<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac main window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#000000}a:hover{color:#3C3C43}
textarea::placeholder,input::placeholder{color:rgba(0,0,0,0.25)}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; padding: 8px; background: #FFFFFF; color: rgba(0,0,0,0.85); font-family: -apple-system, 'SF Pro Text', 'SF Pro', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch;">

  <nav aria-label="Notes" style="flex: 1 1 260px; max-width: 320px; min-width: 0; box-sizing: border-box; border-radius: 18px; background: rgba(242,242,245,0.92); border: 0.5px solid rgba(0,0,0,0.06); box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 18px rgba(0,0,0,0.06); padding: 0 8px 12px; display: flex; flex-direction: column;">
    <div style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 8px;">
      <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 999px; background: #FF5F57;"></span>
      <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 999px; background: #FEBC2E;"></span>
      <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 999px; background: #28C840;"></span>
    </div>
    <div style="padding: 4px 8px 6px; font-size: 11px; line-height: 14px; font-weight: 700; color: rgba(0,0,0,0.5);">Notes</div>
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
      <button type="button" aria-current="{{row.current}}" style="display: flex; flex-direction: column; gap: 2px; width: 100%; box-sizing: border-box; margin: 0 0 2px; padding: 7px 10px 8px; border: none; border-radius: 10px; background: {{row.bg}}; color: {{row.fg}}; text-align: left; font-family: inherit;">
        <span style="display: flex; align-items: center; gap: 6px; width: 100%;">
          <sc-if value="{{row.arrived}}" hint-placeholder-val="{{ false }}">
            <span aria-label="Arrived" style="flex: 0 0 7px; width: 7px; height: 7px; border-radius: 999px; background: currentColor;"></span>
          </sc-if>
          <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; line-height: 16px; font-weight: 700;">{{row.title}}</span>
          <sc-if value="{{row.needsYou}}" hint-placeholder-val="{{ false }}">
            <svg role="img" aria-label="Needs you" viewBox="0 0 24 24" width="14" height="14" style="flex: 0 0 auto; color: #C55300;"><path d="M12 3.2L2.4 20.2h19.2z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><path d="M12 9.5v4.8" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="17.2" r="1.2" fill="#FFFFFF"></circle></svg>
          </sc-if>
          <sc-if value="{{row.pending}}" hint-placeholder-val="{{ false }}">
            <svg role="img" aria-label="Text on its way" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" style="flex: 0 0 auto; opacity: 0.6;"><circle cx="12" cy="12" r="9"></circle><circle cx="8" cy="12" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="16" cy="12" r="1.1" fill="currentColor" stroke="none"></circle></svg>
          </sc-if>
        </span>
        <sc-if value="{{row.hasPreview}}" hint-placeholder-val="{{ true }}">
          <span style="font-size: 11px; line-height: 14px; opacity: {{row.dim}};">{{row.preview}}</span>
        </sc-if>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; line-height: 14px; opacity: {{row.dim}};">
          <span style="font-variant-numeric: tabular-nums;">{{row.time}}</span>
          <sc-if value="{{row.text}}" hint-placeholder-val="{{ true }}">
            <svg role="img" aria-label="Typed" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"></path></svg>
          </sc-if>
          <sc-if value="{{row.voice}}" hint-placeholder-val="{{ false }}">
            <svg role="img" aria-label="Recording" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10v4"></path></svg>
          </sc-if>
          <sc-if value="{{row.ink}}" hint-placeholder-val="{{ false }}">
            <svg role="img" aria-label="Sketch" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16c3-6 5-9 6.5-7.5S6.5 16 8.5 17s4-9 6-8-2 7 .2 7 3.8-4 6.3-5"></path></svg>
          </sc-if>
        </span>
      </button>
    </sc-for>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; min-height: 784px; box-sizing: border-box; position: relative; display: flex; flex-direction: column;">
    <div style="height: 52px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 12px;">
      <button type="button" title="Type a new thought" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 0.5px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.86); color: rgba(0,0,0,0.85); display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 6px rgba(0,0,0,0.10); font: 400 13px/16px -apple-system, 'SF Pro Text', system-ui, sans-serif;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 4h6M12 4v16M9 20h6"></path></svg>
        Capture
      </button>
      <label style="height: 32px; width: 220px; max-width: 40vw; box-sizing: border-box; padding: 0 10px; border-radius: 999px; border: 0.5px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.86); box-shadow: 0 1px 6px rgba(0,0,0,0.10); display: flex; align-items: center; gap: 6px;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5l5 5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search</span>
        <input type="search" placeholder="Search" style="flex: 1 1 auto; min-width: 0; border: none; outline: none; background: transparent; padding: 0; color: rgba(0,0,0,0.85); font: 400 13px/16px -apple-system, 'SF Pro Text', system-ui, sans-serif;">
      </label>
    </div>

    <article style="flex: 1 1 auto; padding: 28px 20px 120px 28px; display: flex; flex-direction: column; gap: 24px; max-width: 672px;">
      <div style="font-size: 13px; line-height: 18px;">The talk should open on the problem, not the product.</div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 10px; height: 28px; max-width: 420px;">
          <button type="button" aria-label="Pause" style="width: 28px; height: 28px; border: none; background: transparent; color: rgba(0,0,0,0.85); padding: 0; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"></rect></svg>
          </button>
          <div aria-hidden="true" style="flex: 1 1 auto; display: flex; align-items: center; gap: 3px; height: 22px; overflow: hidden;">
            <sc-for list="{{bars}}" as="bar" hint-placeholder-count="40">
              <div style="flex: 0 0 3px; width: 3px; border-radius: 999px; background: {{bar.color}}; height: {{bar.h}}px;"></div>
            </sc-for>
          </div>
          <div style="font-size: 11px; line-height: 14px; color: rgba(0,0,0,0.5); font-variant-numeric: tabular-nums; white-space: nowrap;">0:14 / 0:42</div>
        </div>
        <div style="font-size: 13px; line-height: 18px;">Three minutes on what goes wrong when a thought has nowhere to land. Then the demo, and end on the Watch.</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 10px; height: 28px; max-width: 420px;">
          <button type="button" aria-label="Play" style="width: 28px; height: 28px; border: none; background: transparent; color: rgba(0,0,0,0.85); padding: 0; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7.5 5v14l11-7z" fill="currentColor"></path></svg>
          </button>
          <div aria-hidden="true" style="flex: 1 1 auto; display: flex; align-items: center; gap: 3px; height: 22px; overflow: hidden;">
            <sc-for list="{{pendingBars}}" as="bar" hint-placeholder-count="26">
              <div style="flex: 0 0 3px; width: 3px; border-radius: 999px; background: rgba(0,0,0,0.1); height: {{bar.h}}px;"></div>
            </sc-for>
          </div>
          <div style="font-size: 11px; line-height: 14px; color: rgba(0,0,0,0.5); font-variant-numeric: tabular-nums;">0:09</div>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 11px; line-height: 14px; color: rgba(0,0,0,0.5);">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="8" cy="12" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="16" cy="12" r="1.1" fill="currentColor" stroke="none"></circle></svg>
          <span>Saved, text on its way</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 13px; line-height: 18px;">Put the demo video in the speaker notes.</div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 11px; line-height: 14px; color: rgba(0,0,0,0.5);">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"></rect><path d="M7 10l3 2-3 2M12.5 15H17"></path></svg>
          <span>Added from the command line</span>
        </div>
      </div>

      <textarea aria-label="Capture field" rows="2" placeholder="Type a thought" style="display: block; width: 100%; box-sizing: border-box; margin: 0; padding: 0; border: none; outline: none; resize: none; background: transparent; color: rgba(0,0,0,0.85); caret-color: #000000; font: 400 13px/18px -apple-system, 'SF Pro Text', system-ui, sans-serif;"></textarea>
    </article>

    <div style="position: absolute; left: 20px; right: 20px; bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 0.5px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.86); color: rgba(0,0,0,0.85); display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 6px rgba(0,0,0,0.10); font: 400 13px/16px -apple-system, 'SF Pro Text', system-ui, sans-serif;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V13"></path><path d="M17.6 3.6l2.8 2.8L12 14.8l-3.6.8.8-3.6z"></path></svg>
        New note
      </button>
      <button type="button" aria-label="Record" style="width: 44px; height: 44px; border-radius: 999px; border: 0.5px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.86); color: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 8px rgba(0,0,0,0.12); padding: 0;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11.5" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
      </button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (r) => {
      const current = Boolean(r.current);
      return {
        arrived: false, pending: false, needsYou: false, text: false, voice: false, ink: false, preview: '', ...r,
        hasPreview: Boolean(r.preview),
        current: current ? 'page' : 'false',
        bg: current ? '#0A64D8' : 'transparent',
        fg: current ? '#FFFFFF' : 'rgba(0,0,0,0.85)',
        dim: current ? '0.85' : '0.58',
      };
    };
    const levels = [6,9,12,16,10,7,13,17,20,14,8,7,11,16,19,13,8,5,10,14,17,11,7,8,13,16,10,7,5,8,11,14,10,7,5,8,7,5,4,4];
    const pending = [7,10,14,18,12,8,11,16,20,14,10,7,5,8,13,17,11,8,7,10,13,8,7,5,4,4];
    return {
      rows: [
        row({ title: 'Book the dentist before the 12th', preview: 'Ask about the night guard too.', time: '9:41', text: true, arrived: true }),
        row({ title: 'The talk should open on the problem', preview: 'not the product. Three minutes, then the demo.', time: '9:38', voice: true, text: true, pending: true, current: true }),
        row({ title: 'Recording, 0:42', time: 'Yesterday', voice: true, needsYou: true }),
        row({ title: 'Tram stop sign', preview: 'Show the next two arrivals, not one.', time: 'Tue', ink: true, text: true }),
        row({ title: 'Groceries', preview: 'Oat milk, lemons, the good bread.', time: '24 Nov', text: true }),
        row({ title: '3 recordings', time: '21 Nov', voice: true }),
        row({ title: 'Ask Sam whether the Lisbon offsite moves to March', preview: 'If it does, the venue hold needs to move with it.', time: '20 Nov', text: true }),
      ],
      bars: levels.map((h, i) => ({ h, color: i < 13 ? 'rgba(0,0,0,0.85)' : 'rgba(0,0,0,0.1)' })),
      pendingBars: pending.map((h) => ({ h })),
    };
  }
}
</script>
</body>
</html>
