<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone notes stream</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#000000}a:hover{color:#3C3C43}
input::placeholder{color:rgba(60,60,67,0.6)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; border-radius: 44px; background: #FFFFFF; color: #000000; font-family: -apple-system, 'SF Pro Text', 'SF Pro', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; top: 62px; left: 16px; right: 16px; height: 44px; display: flex; align-items: center;">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 0.5px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.82); color: #000000; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(0,0,0,0.10); padding: 0;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
  </div>

  <div style="position: absolute; top: 112px; left: 0; right: 0; display: flex; flex-direction: column;">
    <h1 style="margin: 0; padding: 0 16px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px;">Notes</h1>

    <div style="margin: 12px 16px 4px; padding: 12px 12px 12px 16px; border-radius: 16px; background: rgba(118,118,128,0.12); display: flex; align-items: center; gap: 12px;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M12 3v9M8.5 8.5L12 12l3.5-3.5"></path><path d="M3.5 14h4.5l1.2 3h5.6l1.2-3h4.5v4.5A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5z"></path></svg>
      <div style="flex: 1 1 auto; font-size: 16px; line-height: 21px; letter-spacing: -0.31px;">A capture arrived.</div>
      <button type="button" style="height: 32px; padding: 0 14px; border: none; border-radius: 999px; background: rgba(118,118,128,0.16); color: #000000; font: 600 15px/20px -apple-system, 'SF Pro Text', system-ui, sans-serif;">Show</button>
      <button type="button" aria-label="Dismiss" style="width: 32px; height: 32px; border: none; border-radius: 999px; background: transparent; color: rgba(60,60,67,0.6); display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
      <button type="button" style="display: block; width: 100%; margin: 0; padding: 0 0 0 16px; border: none; background: transparent; text-align: left; color: #000000; font-family: inherit;">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 11px 16px 11px 0; border-bottom: 0.5px solid rgba(60,60,67,0.29);">
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <sc-if value="{{row.arrived}}" hint-placeholder-val="{{ false }}">
              <span aria-label="Arrived" style="flex: 0 0 8px; width: 8px; height: 8px; border-radius: 999px; background: #000000; align-self: center;"></span>
            </sc-if>
            <span style="flex: 1 1 auto; font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -0.43px;">{{row.title}}</span>
            <sc-if value="{{row.needsYou}}" hint-placeholder-val="{{ false }}">
              <svg role="img" aria-label="Needs you" viewBox="0 0 24 24" width="18" height="18" style="flex: 0 0 auto; align-self: center; color: #C55300;"><path d="M12 3.2L2.4 20.2h19.2z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><path d="M12 9.5v4.8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path><circle cx="12" cy="17.2" r="1.1" fill="#FFFFFF"></circle></svg>
            </sc-if>
            <sc-if value="{{row.pending}}" hint-placeholder-val="{{ false }}">
              <svg role="img" aria-label="Text on its way" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" style="flex: 0 0 auto; align-self: center; color: rgba(60,60,67,0.6);"><circle cx="12" cy="12" r="9"></circle><circle cx="8" cy="12" r="1" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"></circle><circle cx="16" cy="12" r="1" fill="currentColor" stroke="none"></circle></svg>
            </sc-if>
          </div>
          <sc-if value="{{row.hasPreview}}" hint-placeholder-val="{{ true }}">
            <div style="font-size: 15px; line-height: 20px; letter-spacing: -0.23px; color: rgba(60,60,67,0.6);">{{row.preview}}</div>
          </sc-if>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; letter-spacing: -0.08px; color: rgba(60,60,67,0.6);">
            <span style="font-variant-numeric: tabular-nums;">{{row.time}}</span>
            <sc-if value="{{row.text}}" hint-placeholder-val="{{ true }}">
              <svg role="img" aria-label="Typed" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"></path></svg>
            </sc-if>
            <sc-if value="{{row.voice}}" hint-placeholder-val="{{ false }}">
              <svg role="img" aria-label="Recording" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10v4"></path></svg>
            </sc-if>
            <sc-if value="{{row.ink}}" hint-placeholder-val="{{ false }}">
              <svg role="img" aria-label="Sketch" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16c3-6 5-9 6.5-7.5S6.5 16 8.5 17s4-9 6-8-2 7 .2 7 3.8-4 6.3-5"></path></svg>
            </sc-if>
          </div>
        </div>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 0.5px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.86); box-shadow: 0 2px 14px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 8px;">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="rgba(60,60,67,0.6)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5l5 5"></path></svg>
    <label style="flex: 1 1 auto; display: flex;">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search</span>
      <input type="search" placeholder="Search" style="flex: 1 1 auto; min-width: 0; border: none; outline: none; background: transparent; padding: 0; color: #000000; font: 400 17px/22px -apple-system, 'SF Pro Text', system-ui, sans-serif; letter-spacing: -0.43px;">
    </label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (r) => ({ arrived: false, pending: false, needsYou: false, text: false, voice: false, ink: false, preview: '', ...r, hasPreview: Boolean(r.preview) });
    return {
      rows: [
        row({ title: 'Book the dentist before the 12th', preview: 'Ask about the night guard too.', time: '9:41', text: true, arrived: true }),
        row({ title: 'The talk should open on the problem', preview: 'not the product. Three minutes, then the demo.', time: '9:38', voice: true, pending: true }),
        row({ title: 'Recording, 0:42', time: 'Yesterday', voice: true, needsYou: true }),
        row({ title: 'Tram stop sign', preview: 'Show the next two arrivals, not one.', time: 'Tue', ink: true, text: true }),
        row({ title: 'Groceries', preview: 'Oat milk, lemons, the good bread.', time: '24 Nov', text: true }),
        row({ title: '3 recordings', time: '21 Nov', voice: true }),
        row({ title: 'Ask Sam whether the Lisbon offsite moves to March', preview: 'If it does, the venue hold needs to move with it.', time: '20 Nov', text: true }),
      ],
    };
  }
}
</script>
</body>
</html>
