<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone open note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#000000}a:hover{color:#3C3C43}
textarea::placeholder{color:rgba(60,60,67,0.3)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; border-radius: 44px; background: #FFFFFF; color: #000000; font-family: -apple-system, 'SF Pro Text', 'SF Pro', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; top: 62px; left: 16px; right: 16px; height: 44px; display: flex; align-items: center;">
    <button type="button" aria-label="Back to Notes" style="width: 44px; height: 44px; border-radius: 999px; border: 0.5px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.82); color: #000000; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(0,0,0,0.10); padding: 0;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
  </div>

  <div style="position: absolute; top: 130px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 24px;">

    <div style="font-size: 17px; line-height: 22px; letter-spacing: -0.43px;">The talk should open on the problem, not the product.</div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 12px; height: 32px;">
        <button type="button" aria-label="Pause" style="width: 32px; height: 32px; border: none; background: transparent; color: #000000; padding: 0; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"></rect></svg>
        </button>
        <div aria-hidden="true" style="flex: 1 1 auto; display: flex; align-items: center; gap: 3px; height: 28px; overflow: hidden;">
          <sc-for list="{{bars}}" as="bar" hint-placeholder-count="40">
            <div style="flex: 0 0 3px; width: 3px; border-radius: 999px; background: {{bar.color}}; height: {{bar.h}}px;"></div>
          </sc-for>
        </div>
        <div style="font-size: 13px; line-height: 18px; color: rgba(60,60,67,0.6); font-variant-numeric: tabular-nums; white-space: nowrap;">0:14 / 0:42</div>
      </div>
      <div style="font-size: 17px; line-height: 22px; letter-spacing: -0.43px;">Three minutes on what goes wrong when a thought has nowhere to land. Then the demo, and end on the Watch.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 12px; height: 32px;">
        <button type="button" aria-label="Play" style="width: 32px; height: 32px; border: none; background: transparent; color: #000000; padding: 0; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7.5 5v14l11-7z" fill="currentColor"></path></svg>
        </button>
        <div aria-hidden="true" style="flex: 1 1 auto; display: flex; align-items: center; gap: 3px; height: 28px; overflow: hidden;">
          <sc-for list="{{pendingBars}}" as="bar" hint-placeholder-count="26">
            <div style="flex: 0 0 3px; width: 3px; border-radius: 999px; background: rgba(60,60,67,0.18); height: {{bar.h}}px;"></div>
          </sc-for>
        </div>
        <div style="font-size: 13px; line-height: 18px; color: rgba(60,60,67,0.6); font-variant-numeric: tabular-nums;">0:09</div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 18px; letter-spacing: -0.08px; color: rgba(60,60,67,0.6);">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="8" cy="12" r="1" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"></circle><circle cx="16" cy="12" r="1" fill="currentColor" stroke="none"></circle></svg>
        <span>Saved, text on its way</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 17px; line-height: 22px; letter-spacing: -0.43px;">Put the demo video in the speaker notes.</div>
      <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 18px; letter-spacing: -0.08px; color: rgba(60,60,67,0.6);">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"></rect><path d="M7 10l3 2-3 2M12.5 15H17"></path></svg>
        <span>Added from the command line</span>
      </div>
    </div>

    <textarea aria-label="Capture field" rows="2" placeholder="Type a thought" style="display: block; width: 100%; box-sizing: border-box; margin: 0; padding: 0; border: none; outline: none; resize: none; background: transparent; color: #000000; caret-color: #000000; font: 400 17px/22px -apple-system, 'SF Pro Text', system-ui, sans-serif; letter-spacing: -0.43px;"></textarea>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 64px; display: flex; align-items: center; justify-content: space-between;">
    <button type="button" aria-label="New note" style="width: 44px; height: 44px; border-radius: 999px; border: 0.5px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.82); color: #000000; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(0,0,0,0.10); padding: 0;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V13"></path><path d="M17.6 3.6l2.8 2.8L12 14.8l-3.6.8.8-3.6z"></path></svg>
    </button>
    <button type="button" aria-label="Record" style="width: 64px; height: 64px; border-radius: 999px; border: 0.5px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.82); color: #000000; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 14px rgba(0,0,0,0.12); padding: 0;">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11.5" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const levels = [6,10,14,20,12,8,16,22,26,18,10,8,14,20,24,16,10,6,12,18,22,14,8,10,16,20,12,8,6,10,14,18,12,8,6,10,8,6,4,4];
    const played = 13;
    const pending = [8,12,18,24,16,10,14,20,26,18,12,8,6,10,16,22,14,10,8,12,16,10,8,6,4,4];
    return {
      bars: levels.map((h, i) => ({ h, color: i < played ? '#000000' : 'rgba(60,60,67,0.18)' })),
      pendingBars: pending.map((h) => ({ h })),
    };
  }
}
</script>
</body>
</html>
