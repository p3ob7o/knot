<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple Watch record screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#000000}a:hover{color:#3C3C43}
</style>
</helmet>
<div style="width: 1040px; height: 360px; box-sizing: border-box; padding: 36px 44px; background: #FFFFFF; font-family: 'SF Compact Text', 'SF Compact', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 40px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div style="width: 208px; height: 248px; box-sizing: border-box; border-radius: 52px; background: #000000; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 16px;">
      <div style="height: 22px;"></div>
      <button type="button" aria-label="Record" style="width: 100px; height: 100px; border-radius: 999px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11.5" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
      </button>
      <div style="height: 34px;"></div>
    </div>
    <div style="font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 13px; line-height: 18px; color: rgba(60,60,67,0.6);">Ready</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div style="width: 208px; height: 248px; box-sizing: border-box; border-radius: 52px; background: #000000; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 16px;">
      <div style="height: 22px; font-size: 17px; line-height: 22px; font-variant-numeric: tabular-nums;">0:12</div>
      <button type="button" aria-label="Stop recording, 0:12" style="width: 100px; height: 100px; border-radius: 999px; border: none; background: #FF453A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"></rect></svg>
      </button>
      <div style="height: 34px; font-size: 14px; line-height: 17px; text-align: center;">Recording</div>
    </div>
    <div style="font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 13px; line-height: 18px; color: rgba(60,60,67,0.6);">Live</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div style="width: 208px; height: 248px; box-sizing: border-box; border-radius: 52px; background: #000000; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 16px;">
      <div style="height: 22px;"></div>
      <button type="button" aria-label="Record" style="width: 100px; height: 100px; border-radius: 999px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </button>
      <div style="height: 34px; font-size: 14px; line-height: 17px; text-align: center;">Saved</div>
    </div>
    <div style="font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 13px; line-height: 18px; color: rgba(60,60,67,0.6);">Saved, one second</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div style="width: 208px; height: 248px; box-sizing: border-box; border-radius: 52px; background: #000000; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 16px;">
      <div style="height: 22px;"></div>
      <button type="button" aria-label="Record" style="width: 100px; height: 100px; border-radius: 999px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11.5" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
      </button>
      <div style="height: 34px; font-size: 14px; line-height: 17px; text-align: center;">Too short. Nothing was kept.</div>
    </div>
    <div style="font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 13px; line-height: 18px; color: rgba(60,60,67,0.6);">Too short</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
