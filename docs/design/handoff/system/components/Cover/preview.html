<!-- @dsCard height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Knot</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--background); color:var(--label); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; width:480px; height:300px; }
  .ink { fill:var(--label); }
  .paper { fill:var(--background); }
  .tint { fill:var(--background-secondary); }
  .grey { fill:var(--label-secondary); }
  .red { fill:var(--record); }
  .blk { rx:var(--radius-xl); }
  .bar { rx:1px; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.92; font-weight:600; letter-spacing:-0.03em; }
  .tag { margin:var(--space-3) 0 0 6px; font-size:14px; line-height:20px; color:var(--label-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      label (ink) slab 232x320 bleeding off the top and bottom (the brand is ink); background-secondary 168x204 (paper's tint, relief); record disc 48 (the red dot, small: it only ever means live); label-secondary 64x112 graphite
  arrangement one tall ink slab with satellites, as the mark is one stem with arms; tops and bottoms on space-6 lines, space-4 gutters
  pattern     a literal motif: a voice waveform, 2px bars (waveform-bar) at a space-2 pitch, cut out of the ink slab in paper and running on over the tint in ink: what Knot records, drawn with its own player's bars
  scales      gutters space-4, edges space-6, slab and tint corners radius-xl, disc rx = half its side, bars rx 1 (radius-full of a 2px bar)
-->
