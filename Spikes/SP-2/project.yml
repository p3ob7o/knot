# SP-2's spike project, generated by XcodeGen into Spikes/SP-2/SP2.xcodeproj, which is not
# committed. Run Spikes/SP-2/build.sh, never xcodegen by hand: the script uses the pinned
# Xcode and this worktree's build folder.
#
# Three targets: the iPhone app, the Watch app embedded in it, and the Watch widget
# extension (complication, Smart Stack widget, controls). Nothing here links KnotKit: the
# spike answers questions about the platform, not about Knot's modules.

name: SP2

options:
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/SP2.xcconfig
  Release: Config/SP2.xcconfig

targets:
  SP2-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - Phone/Sources
    settings:
      base:
        PRODUCT_NAME: SP2
        PRODUCT_BUNDLE_IDENTIFIER: $(SP2_BUNDLE_ID)
        INFOPLIST_FILE: Phone/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SP2_PHONE
    dependencies:
      - target: SP2-watchOS

  SP2-watchOS:
    type: application
    platform: watchOS
    sources:
      - Shared
      - Intents
      - Watch/Sources
    settings:
      base:
        PRODUCT_NAME: SP2
        PRODUCT_BUNDLE_IDENTIFIER: $(SP2_BUNDLE_ID).watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SP2_WATCH_APP
    dependencies:
      - target: SP2-WatchWidgets

  SP2-WatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Shared/EventLog.swift
      - Intents
      - WatchWidgets/Sources
    settings:
      base:
        PRODUCT_NAME: SP2WatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(SP2_BUNDLE_ID).watchkitapp.widgets
        INFOPLIST_FILE: WatchWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SP2_WIDGETS
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework

schemes:
  SP2-iOS:
    build:
      targets:
        SP2-iOS: all
  SP2-watchOS:
    build:
      targets:
        SP2-watchOS: all
