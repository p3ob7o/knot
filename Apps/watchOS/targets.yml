# The Watch app, a companion embedded in the iPhone app, with its widget extension.
targets:
  Knot-watchOS:
    type: application
    platform: watchOS
    templates: [KnotProduct]
    sources:
      - Sources
      - ../Shared
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: Knot
        PRODUCT_BUNDLE_IDENTIFIER: $(KNOT_BUNDLE_ID).watchkitapp
        INFOPLIST_FILE: Apps/watchOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/watchOS/Knot-watchOS-$(KNOT_SIGNING).entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - package: KnotKit
        products: [KnotAudio, KnotCore, KnotIntents, KnotLink, KnotUI]
      - target: Widgets-watchOS

  Knot-watchOS-UITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KNOT_BUNDLE_ID).watchkitapp.uitests
        TEST_TARGET_NAME: Knot-watchOS
    dependencies:
      - target: Knot-watchOS
