# The Mac app, with the `knot` tool embedded in it.
targets:
  Knot-macOS:
    type: application
    platform: macOS
    templates: [KnotProduct]
    sources:
      - Sources
      - ../Shared
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: Knot
        PRODUCT_BUNDLE_IDENTIFIER: $(KNOT_BUNDLE_ID)
        INFOPLIST_FILE: Apps/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Knot-macOS-$(KNOT_SIGNING).entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        KNOT_URL_SCHEME_dev: knot-dev
        KNOT_URL_SCHEME_milestone: knot
        KNOT_URL_SCHEME: $(KNOT_URL_SCHEME_$(KNOT_FLAVOUR))
    dependencies:
      - package: KnotKit
        products: [KnotApp, KnotCore, KnotExport, KnotIntents, KnotUI]
      # Built before the app, and embedded by the script below rather than by a copy phase.
      # A copy phase names the tool by the product name its target has without the build's
      # command-line settings, so with KNOT_FLAVOUR=milestone on the command line it looked
      # for knot-dev while the tool was built under the milestone's name. The script runs in
      # this target's settings, which hold the command line's (WP-22, row 22d).
      - target: knot-tool
        embed: false
        link: false
    postBuildScripts:
      - name: Embed the knot tool
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(KNOT_TOOL_FILE)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/$(KNOT_TOOL_FILE)
        script: |
          set -eu
          # The tool's file and the app's executable share Contents/MacOS. On a volume that
          # ignores case, names that differ only in case are one file, and the copy would
          # replace the app's executable.
          tool=$(printf '%s' "$KNOT_TOOL_FILE" | tr '[:upper:]' '[:lower:]')
          app=$(printf '%s' "$EXECUTABLE_NAME" | tr '[:upper:]' '[:lower:]')
          if [ "$tool" = "$app" ]; then
            echo "error: the knot tool's file, $KNOT_TOOL_FILE, is the app's executable, $EXECUTABLE_NAME, without regard to case."
            exit 1
          fi
          # The tool as its own target built and signed it, with its own entitlements, into
          # Contents/MacOS under its file's name: knot-dev, or knot-cli for a milestone build.
          # The app's signature, made after every build phase, seals it.
          destination="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          mkdir -p "$destination"
          rm -f "$destination/$KNOT_TOOL_FILE"
          ditto "$BUILT_PRODUCTS_DIR/$KNOT_TOOL_FILE" "$destination/$KNOT_TOOL_FILE"

  Knot-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
      - ../UITestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KNOT_BUNDLE_ID).uitests
        LM_SKIP_METADATA_EXTRACTION: YES
        TEST_TARGET_NAME: Knot-macOS
        # Signed ad hoc, the UI test runner cannot load its test bundle under the hardened
        # runtime: library validation refuses a bundle whose ad hoc signature differs, and
        # ad hoc signing has no team to share. A test target never ships.
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: Knot-macOS

  Knot-macOS-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - UnitTests
      - Sources/HotkeyGesture.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KNOT_BUNDLE_ID).tests
        LM_SKIP_METADATA_EXTRACTION: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: KnotKit
        products: [KnotCore, KnotFakes]

  Knot-macOS-HostedUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - HostedUITests
      - ../UITestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KNOT_BUNDLE_ID).hosted-uitests
        LM_SKIP_METADATA_EXTRACTION: YES
        TEST_TARGET_NAME: Knot-macOS
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: Knot-macOS

schemes:
  Knot-macOS-Hosted:
    build:
      targets:
        Knot-macOS: all
    test:
      targets:
        - Knot-macOS-HostedUITests

  Knot-macOS-Rules:
    build:
      targets:
        Knot-macOS-Tests: [test]
    test:
      targets:
        - Knot-macOS-Tests
