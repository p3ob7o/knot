# The iPhone and iPad app (universal), with the Watch app and the widget extension
# embedded in it.
targets:
  Knot-iOS:
    type: application
    platform: iOS
    templates: [KnotProduct]
    sources:
      - Sources
      - ../Shared
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: Knot
        PRODUCT_BUNDLE_IDENTIFIER: $(KNOT_BUNDLE_ID)
        INFOPLIST_FILE: Apps/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Knot-iOS-$(KNOT_SIGNING).entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: KnotKit
        products: [KnotApp, KnotCore, KnotIntents, KnotUI]
      - target: Widgets-iOS
      - target: Knot-watchOS

  # Tests hosted in the app, for the contract suites that run only in the iOS Simulator
  # (docs/architecture.md §5): RecordingStateStore across two processes, RecordingActivity
  # and InkRecogniser. Later packages add the products of their own modules.
  Knot-iOS-Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KNOT_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Knot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Knot
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Knot-iOS
      - package: KnotKit
        products: [KnotTestSupport, KnotFakes]

  Knot-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - ../UITestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KNOT_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Knot-iOS
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Knot-iOS
